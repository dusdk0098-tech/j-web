<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="apple-mobile-web-app-title" content="J웹">
  <title>현장 출입자 등록 | J웹</title>
  <link rel="apple-touch-icon" href="/jweb-icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/join.js"></script>
</head>
<body>
  <header class="top"><a class="brand" href="/"><span>J</span>웹 <small>현장 안전관리</small></a></header>
  <main>
    <section class="panel">
      <p class="crumb">현장 출입자 등록</p>
      <h1>현장 출입자 등록</h1>
      <p id="join-site" class="muted">가입 링크를 확인하고 있습니다.</p>
      <p id="join-message" role="status" aria-live="polite"></p>
      <div id="worker-choices" hidden><button type="button" data-choose-login>기존 근로자 로그인</button><button type="button" data-choose-join>처음 방문자 등록</button></div>
      <form id="join-form" hidden>
        <div id="join-consent"><p>이 시험 화면은 이름·구분·소속·직종을 이 컴퓨터의 시험 데이터베이스에 저장합니다. 실제 개인정보 대신 가상 정보를 입력하세요.</p>
        <label><input type="checkbox" name="acknowledged" required> 시험 안내를 확인했습니다.</label><p id="join-consent-status" role="status" aria-live="polite"></p><button type="button" id="join-next">다음</button></div>
        <div id="join-details" hidden>
        <p>협력업체는 소속과 직종이 필요합니다. 직영은 소속을, 근로를 제공하지 않는 사람은 소속과 직종을 생략할 수 있습니다.</p>
        <div class="fields">
          <label>이름<input name="name" required maxlength="200"></label>
          <label>구분<select name="category"><option>직영</option><option>협력업체 근로자</option><option>협력업체 관리자</option><option>근로를 제공하지 않는 사람</option><option>기타 출입자</option></select></label>
          <label>소속<input name="company" required maxlength="200"></label>
          <label>직종<input name="occupation" required maxlength="200"></label>
        </div>
        <div class="action-row"><button type="button" id="join-back">이전</button><button class="primary">등록</button></div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
