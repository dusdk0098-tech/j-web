<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시험 결재 | J웹</title><link rel="stylesheet" href="/style.css"><script type="module" src="/review.js"></script></head>
<body><header class="top"><a class="brand" href="/"><span>J</span>웹 <small>현장 안전관리</small></a></header><main><h1>시험 결재</h1><p>가상 계정과 가상 자료만 사용하세요. 실제 결재나 본인 확인을 증명하지 않습니다.</p><p id="message" role="alert"></p><form id="review-login" class="panel"><h2>시험 결재자 로그인</h2><div class="fields"><label>시험 아이디<input name="loginId" autocomplete="username" required></label><label>시험 암호<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label></div><button type="submit">로그인</button></form><div id="review-main" hidden><button type="button" id="review-logout">로그아웃</button><section id="review-list" class="panel"></section><section id="review-document" class="panel" hidden></section></div></main></body></html>
