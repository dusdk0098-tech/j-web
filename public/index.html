<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J웹 | 현장 안전관리</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/ai-chat.css"><script type="module" src="/app.js"></script><script type="module" src="/ai-chat.js"></script></head>
<body>
<header class="top"><button id="menu-toggle" class="menu-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button><a href="/" class="brand"><span>J</span>웹 <small>현장 안전관리</small></a><span class="demo-label">가상 데이터 · 로컬 시험</span></header>
<div class="layout"><aside id="sidebar" class="sidebar"><div class="sidebar-title">안전관리</div><nav aria-label="주 메뉴"><button data-page="dashboard" class="selected">현장 현황</button><button data-page="manager-check">관리자 자가점검</button><button data-page="workers">출입자 관리</button><button data-page="companies">협력사 관리</button><button data-page="safety-costs">산업안전보건관리비</button><button data-page="equipment">기계·장비</button><button data-page="rigging">줄걸이·체결장구</button><button data-page="work-places">작업장소</button><button data-page="attendance">출역 관리</button><button data-page="stops">작업중지 요청</button><button data-page="documents">안전 문서</button><button data-page="approval">미결재 문서</button><button data-page="statistics">안전 활동 통계</button></nav><div class="sidebar-help">현장을 선택한 뒤 업무를 시작하세요.</div></aside>
<main><div class="main-head"><div><p class="crumb">J웹 / <span id="crumb">현장 현황</span></p><h1 id="heading">현장 현황</h1></div><div class="site-control"><label for="site-select">현재 현장</label><select id="site-select"></select><button id="site-add" class="outline">현장 추가</button><button id="site-qr" class="outline">가입 QR</button></div></div><div id="notice" role="status" aria-live="polite"></div><section id="content"></section></main></div>
<dialog id="dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" class="icon-button" aria-label="닫기">×</button></div><div id="dialog-error" role="alert"></div><div id="dialog-body"></div><div class="dialog-actions"><button type="button" id="dialog-cancel" class="outline">취소</button><button class="primary" type="submit">저장</button></div></form></dialog>
<div id="ai-chat" class="ai-chat">
<button id="ai-toggle" class="primary" type="button" aria-expanded="false" aria-controls="ai-panel">AI 상담</button>
<section id="ai-panel" hidden aria-labelledby="ai-title">
<div class="ai-head"><h2 id="ai-title">AI 상담</h2><button id="ai-close" class="outline" type="button">닫기</button></div>
<p id="ai-status" role="status">연결 상태를 확인해 주세요.</p>
<p class="ai-help">전송을 누르면 입력한 질문과 선택한 사진만 설정된 AI 제공업체에 전달됩니다. 실제 개인정보 대신 가상 자료를 사용하세요. 답변은 오류가 있을 수 있습니다.</p>
<div id="ai-messages" role="log" aria-label="상담 답변" aria-live="polite"></div>
<form id="ai-form">
<label for="ai-text">질문 (최대 4,000자)</label><textarea id="ai-text" maxlength="4000" rows="3"></textarea>
<label for="ai-file">사진 한 장 (JPEG·PNG·WebP, 최대 5MB)</label><input id="ai-file" type="file" accept="image/jpeg,image/png,image/webp">
<div id="ai-attachment" hidden><img id="ai-preview" alt="전송할 사진 미리보기"><span id="ai-filename"></span><button id="ai-remove" type="button" class="outline">사진 제거</button></div>
<p id="ai-error" role="alert"></p><button id="ai-send" class="primary" type="submit" disabled>전송</button>
</form><p class="ai-help">대화는 이 화면에서만 유지됩니다. 새로고침하거나 페이지를 나가면 사라집니다. 답변 평가는 로컬에 저장됩니다.</p>
</section></div>
</body></html>
